<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1240" height="400" viewBox="0 0 1240 400" font-family="'Segoe UI', 'Segoe UI Variable', Helvetica, Arial, sans-serif">
  <title>How Maroom swaps the desktop folder contents when you switch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f5c"/>
      <stop offset="1" stop-color="#071a36"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4cc2ff"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b48cff"/>
    </marker>
    <symbol id="folderBig" viewBox="0 0 40 40">
      <path d="M3 9a3 3 0 0 1 3-3h9l4 4h15a3 3 0 0 1 3 3v3H3z" fill="#e3a21a"/>
      <rect x="3" y="13" width="34" height="22" rx="3" fill="#ffc83d"/>
    </symbol>
    <symbol id="doc" viewBox="0 0 40 40">
      <path d="M9 3h16l8 8v26H9z" fill="#fff"/><path d="M25 3v8h8z" fill="#c9d6e8"/>
      <rect x="4" y="20" width="14" height="14" rx="2" fill="#185abd"/>
      <path d="M7 24l1.5 7 2.5-5 2.5 5 1.5-7" stroke="#fff" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
    </symbol>
    <symbol id="sheet" viewBox="0 0 40 40">
      <path d="M9 3h16l8 8v26H9z" fill="#fff"/><path d="M25 3v8h8z" fill="#c9e3d3"/>
      <rect x="4" y="20" width="14" height="14" rx="2" fill="#107c41"/>
      <path d="M8 24l6 7M14 24l-6 7" stroke="#fff" stroke-width="1.6"/>
    </symbol>
    <symbol id="txt" viewBox="0 0 40 40">
      <path d="M9 3h16l8 8v26H9z" fill="#fff"/><path d="M25 3v8h8z" fill="#d6d6d6"/>
      <path d="M13 16h16M13 21h16M13 26h16M13 31h9" stroke="#a8a8a8" stroke-width="2"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 40 40">
      <rect x="4" y="7" width="32" height="26" rx="3" fill="#fff"/>
      <rect x="7" y="10" width="26" height="20" rx="1.5" fill="#7cc4f4"/>
      <circle cx="27" cy="15" r="3" fill="#ffd54a"/><path d="M7 30l8-10 6 7 4-4 8 7z" fill="#3a9a5b"/>
    </symbol>
    <symbol id="game" viewBox="0 0 40 40">
      <path d="M12 12h16c5 0 8 5 9 12 .8 5-3 8-6 5l-4-4H13l-4 4c-3 3-6.8 0-6-5 1-7 4-12 9-12z" fill="#f2f4f8"/>
      <path d="M11 17v6M8 20h6" stroke="#2b2f3a" stroke-width="2" stroke-linecap="round"/>
      <circle cx="27" cy="18" r="1.7" fill="#4c8bff"/><circle cx="30.5" cy="21" r="1.7" fill="#ff6b6b"/>
      <circle cx="27" cy="24" r="1.7" fill="#3aa65a"/><circle cx="23.5" cy="21" r="1.7" fill="#e0b000"/>
    </symbol>
    <symbol id="music" viewBox="0 0 40 40">
      <path d="M3 9a3 3 0 0 1 3-3h9l4 4h15a3 3 0 0 1 3 3v3H3z" fill="#e3a21a"/>
      <rect x="3" y="13" width="34" height="22" rx="3" fill="#ffc83d"/>
      <path d="M22 17v10.5a3 3 0 1 1-2-2.8V19l7-1.5v8a3 3 0 1 1-2-2.8V17.8z" fill="#b06d00"/>
    </symbol>
    <!-- icon sets -->
    <g id="setA"><use xlink:href="#doc" width="34" height="34"/><use xlink:href="#sheet" x="40" width="34" height="34"/><use xlink:href="#txt" x="80" width="34" height="34"/></g>
    <g id="setB"><use xlink:href="#photo" width="34" height="34"/><use xlink:href="#music" x="40" width="34" height="34"/><use xlink:href="#game" x="80" width="34" height="34"/></g>
  </defs>

  <rect width="1240" height="400" rx="18" fill="url(#bg)"/>

  <!-- ===== State: Desktop 1 active ===== -->
  <g transform="translate(50 40)">
    <text x="0" y="22" font-size="22" font-weight="600" fill="#fff">Desktop 1 active</text>
    <circle cx="200" cy="15" r="5" fill="#0078d4"/><circle cx="218" cy="15" r="4.5" fill="none" stroke="#9aa9bd" stroke-width="1.5"/>

    <!-- desktop folder (visible) -->
    <rect x="0" y="48" width="440" height="138" rx="12" fill="#1a6fd0" fill-opacity="0.35" stroke="#4cc2ff" stroke-width="2"/>
    <use xlink:href="#folderBig" x="18" y="62" width="30" height="30"/>
    <text x="56" y="84" font-size="16" font-weight="600" fill="#fff">Desktop</text>
    <text x="422" y="84" font-size="13" fill="#bcd6f5" text-anchor="end">shown on screen</text>
    <use xlink:href="#setA" x="22" y="112"/>
    <rect x="22" y="160" width="110" height="6" rx="3" fill="#4cc2ff" opacity="0.7"/>
    <text x="146" y="166" font-size="13" fill="#bcd6f5">icons of desktop 1</text>

    <!-- stored folder -->
    <rect x="0" y="206" width="440" height="118" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 5"/>
    <use xlink:href="#folderBig" x="18" y="220" width="30" height="30"/>
    <text x="56" y="242" font-size="16" font-weight="600" fill="#fff">Desktop 2</text>
    <text x="422" y="242" font-size="13" fill="#9fb3cf" text-anchor="end">stored next to it</text>
    <g opacity="0.75"><use xlink:href="#setB" x="22" y="266"/></g>
    <rect x="22" y="306" width="110" height="6" rx="3" fill="#b48cff" opacity="0.7"/>
    <text x="146" y="312" font-size="13" fill="#9fb3cf">icons of desktop 2</text>
  </g>

  <!-- ===== the swap ===== -->
  <g transform="translate(620 0)">
    <path d="M-110 128 C -40 128 -40 290 46 290" stroke="#4cc2ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M-110 290 C -40 290 -40 128 46 128" stroke="#b48cff" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
    <rect x="-82" y="186" width="164" height="46" rx="23" fill="#0b2242" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="0" y="207" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Rename only</text>
    <text x="0" y="224" font-size="12" fill="#9fb3cf" text-anchor="middle">instant, same drive</text>
    <text x="0" y="72" font-size="14" fill="#dfe9f7" text-anchor="middle">Switch</text>
    <text x="0" y="92" font-size="12" fill="#9fb3cf" text-anchor="middle">Alt+2 · mouse · tray</text>
  </g>

  <!-- ===== State: Desktop 2 active ===== -->
  <g transform="translate(750 40)">
    <text x="0" y="22" font-size="22" font-weight="600" fill="#fff">Desktop 2 active</text>
    <circle cx="200" cy="15" r="4.5" fill="none" stroke="#9aa9bd" stroke-width="1.5"/><circle cx="218" cy="15" r="5" fill="#0078d4"/>

    <rect x="0" y="48" width="440" height="138" rx="12" fill="#7b4fd0" fill-opacity="0.32" stroke="#b48cff" stroke-width="2"/>
    <use xlink:href="#folderBig" x="18" y="62" width="30" height="30"/>
    <text x="56" y="84" font-size="16" font-weight="600" fill="#fff">Desktop</text>
    <text x="422" y="84" font-size="13" fill="#d9c8f7" text-anchor="end">shown on screen</text>
    <use xlink:href="#setB" x="22" y="112"/>
    <rect x="22" y="160" width="110" height="6" rx="3" fill="#b48cff" opacity="0.7"/>
    <text x="146" y="166" font-size="13" fill="#d9c8f7">icons of desktop 2</text>

    <rect x="0" y="206" width="440" height="118" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 5"/>
    <use xlink:href="#folderBig" x="18" y="220" width="30" height="30"/>
    <text x="56" y="242" font-size="16" font-weight="600" fill="#fff">Desktop 1</text>
    <text x="422" y="242" font-size="13" fill="#9fb3cf" text-anchor="end">stored next to it</text>
    <g opacity="0.75"><use xlink:href="#setA" x="22" y="266"/></g>
    <rect x="22" y="306" width="110" height="6" rx="3" fill="#4cc2ff" opacity="0.7"/>
    <text x="146" y="312" font-size="13" fill="#9fb3cf">icons of desktop 1</text>
  </g>

  <text x="620" y="384" font-size="13" fill="#9fb3cf" text-anchor="middle">Icon positions are saved per desktop · every swap is journaled in state.txt</text>
</svg>
