<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1240" height="470" viewBox="0 0 1240 470" font-family="'Segoe UI', 'Segoe UI Variable', Helvetica, Arial, sans-serif">
  <title>Maroom: two Windows 11 virtual desktops, each with its own desktop icons</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f5c"/>
      <stop offset="1" stop-color="#071a36"/>
    </linearGradient>
    <linearGradient id="wall1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3898ec"/>
      <stop offset="1" stop-color="#0a4896"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b4fd0"/>
      <stop offset="1" stop-color="#127a86"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.72" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect width="500" height="300" rx="6"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="txt" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <!-- desktop icon glyphs, 40x40 -->
    <symbol id="folder" viewBox="0 0 40 40">
      <path d="M3 9a3 3 0 0 1 3-3h9l4 4h15a3 3 0 0 1 3 3v3H3z" fill="#e3a21a"/>
      <rect x="3" y="13" width="34" height="22" rx="3" fill="#ffc83d"/>
    </symbol>
    <symbol id="doc" viewBox="0 0 40 40">
      <path d="M9 3h16l8 8v26H9z" fill="#fff"/>
      <path d="M25 3v8h8z" fill="#c9d6e8"/>
      <rect x="13" y="16" width="16" height="2" fill="#9db4d3"/>
      <rect x="13" y="21" width="16" height="2" fill="#9db4d3"/>
      <rect x="13" y="26" width="11" height="2" fill="#9db4d3"/>
      <rect x="4" y="20" width="14" height="14" rx="2" fill="#185abd"/>
      <path d="M7 24l1.5 7 2.5-5 2.5 5 1.5-7" stroke="#fff" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
    </symbol>
    <symbol id="sheet" viewBox="0 0 40 40">
      <path d="M9 3h16l8 8v26H9z" fill="#fff"/>
      <path d="M25 3v8h8z" fill="#c9e3d3"/>
      <path d="M14 16h15v14H14zM14 21h15M14 25.5h15M20 16v14" stroke="#7fbf98" stroke-width="1.2" fill="none"/>
      <rect x="4" y="20" width="14" height="14" rx="2" fill="#107c41"/>
      <path d="M8 24l6 7M14 24l-6 7" stroke="#fff" stroke-width="1.6"/>
    </symbol>
    <symbol id="txt" viewBox="0 0 40 40">
      <path d="M9 3h16l8 8v26H9z" fill="#fff"/>
      <path d="M25 3v8h8z" fill="#d6d6d6"/>
      <rect x="13" y="15" width="16" height="2" fill="#a8a8a8"/>
      <rect x="13" y="20" width="16" height="2" fill="#a8a8a8"/>
      <rect x="13" y="25" width="16" height="2" fill="#a8a8a8"/>
      <rect x="13" y="30" width="9" height="2" fill="#a8a8a8"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 40 40">
      <rect x="4" y="7" width="32" height="26" rx="3" fill="#fff"/>
      <rect x="7" y="10" width="26" height="20" rx="1.5" fill="#7cc4f4"/>
      <circle cx="27" cy="15" r="3" fill="#ffd54a"/>
      <path d="M7 30l8-10 6 7 4-4 8 7z" fill="#3a9a5b"/>
    </symbol>
    <symbol id="music" viewBox="0 0 40 40">
      <path d="M3 9a3 3 0 0 1 3-3h9l4 4h15a3 3 0 0 1 3 3v3H3z" fill="#e3a21a"/>
      <rect x="3" y="13" width="34" height="22" rx="3" fill="#ffc83d"/>
      <path d="M22 17v10.5a3 3 0 1 1-2-2.8V19l7-1.5v8a3 3 0 1 1-2-2.8V17.8z" fill="#b06d00"/>
    </symbol>
    <symbol id="game" viewBox="0 0 40 40">
      <path d="M12 12h16c5 0 8 5 9 12 .8 5-3 8-6 5l-4-4H13l-4 4c-3 3-6.8 0-6-5 1-7 4-12 9-12z" fill="#2b2f3a"/>
      <path d="M11 17v6M8 20h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="27" cy="18" r="1.7" fill="#4cc2ff"/>
      <circle cx="30.5" cy="21" r="1.7" fill="#ff6b6b"/>
      <circle cx="27" cy="24" r="1.7" fill="#7bd88f"/>
      <circle cx="23.5" cy="21" r="1.7" fill="#ffd54a"/>
    </symbol>
    <symbol id="bin" viewBox="0 0 40 40">
      <path d="M11 12h18l-2 23H13z" fill="#e8f1fb" stroke="#9ab" stroke-width="1"/>
      <rect x="9" y="9" width="22" height="4" rx="1.5" fill="#cfdcea"/>
      <path d="M16 16l1 16M20 16v16M24 16l-1 16" stroke="#9ab" stroke-width="1"/>
    </symbol>
    <symbol id="tray" viewBox="0 0 16 16">
      <rect width="16" height="16" rx="4" fill="#1a6fd0"/>
    </symbol>
  </defs>

  <rect width="1240" height="470" rx="18" fill="url(#bg)"/>
  <path d="M0 405 C 160 365 300 445 460 405 S 760 365 920 405 S 1140 445 1240 410 V470 H0z" fill="#ffffff" opacity="0.04"/>
  <path d="M60 438 C 180 412 300 464 420 438 S 660 412 780 438 S 1020 464 1180 438" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ===== Desktop 1 ===== -->
  <g transform="translate(60 44)">
    <rect x="-10" y="-10" width="520" height="320" rx="16" fill="#0d1320" filter="url(#shadow)"/>
    <path d="M220 310h60l8 22h-76z" fill="#0d1320"/>
    <rect x="180" y="330" width="140" height="7" rx="3.5" fill="#0d1320"/>
    <g clip-path="url(#screen)">
      <rect width="500" height="300" fill="url(#wall1)"/>
      <rect width="500" height="300" fill="url(#bloom)"/>
      <path d="M180 300C260 210 380 190 500 220V300z" fill="#ffffff" opacity="0.07"/>

      <!-- icons -->
      <g font-size="10.5" fill="#fff" text-anchor="middle" filter="url(#txt)">
        <use xlink:href="#bin" x="22" y="10" width="36" height="36"/><text x="40" y="58">Recycle Bin</text>
        <use xlink:href="#folder" x="22" y="70" width="36" height="36"/><text x="40" y="118">Projects</text>
        <use xlink:href="#doc" x="22" y="130" width="36" height="36"/><text x="40" y="178">Report.docx</text>
        <use xlink:href="#sheet" x="22" y="190" width="36" height="36"/><text x="40" y="238">Budget.xlsx</text>
        <use xlink:href="#txt" x="92" y="10" width="36" height="36"/><text x="110" y="58">Notes.txt</text>
      </g>

      <!-- a window -->
      <g filter="url(#shadow)">
        <rect x="190" y="44" width="270" height="176" rx="8" fill="#ffffff"/>
      </g>
      <rect x="190" y="44" width="270" height="28" rx="8" fill="#f3f3f3"/>
      <rect x="190" y="64" width="270" height="8" fill="#f3f3f3"/>
      <rect x="198" y="52" width="12" height="12" rx="2" fill="#185abd"/>
      <text x="217" y="62" font-size="10.5" fill="#333">Report.docx</text>
      <path d="M408 58h8M428 53.5h7v7h-7zM446 54l7 7M453 54l-7 7" stroke="#555" stroke-width="1" fill="none"/>
      <rect x="210" y="88" width="120" height="9" rx="2" fill="#1f3b63"/>
      <rect x="210" y="108" width="228" height="5" rx="2" fill="#d6dce5"/>
      <rect x="210" y="120" width="216" height="5" rx="2" fill="#d6dce5"/>
      <rect x="210" y="132" width="228" height="5" rx="2" fill="#d6dce5"/>
      <rect x="210" y="144" width="150" height="5" rx="2" fill="#d6dce5"/>
      <rect x="210" y="164" width="96" height="40" rx="3" fill="#dbe9fb"/>
      <path d="M216 196l14-12 10 6 14-14 14 10 10-6v16z" fill="#6aa7ea"/>
      <rect x="318" y="166" width="120" height="5" rx="2" fill="#d6dce5"/>
      <rect x="318" y="178" width="110" height="5" rx="2" fill="#d6dce5"/>
      <rect x="318" y="190" width="120" height="5" rx="2" fill="#d6dce5"/>

      <!-- taskbar -->
      <rect y="270" width="500" height="30" fill="#1b2433" opacity="0.82"/>
      <g transform="translate(206 277)">
        <g fill="#4cc2ff"><rect width="7" height="7" rx="1"/><rect x="9" width="7" height="7" rx="1"/><rect y="9" width="7" height="7" rx="1"/><rect x="9" y="9" width="7" height="7" rx="1"/></g>
        <rect x="26" y="1" width="16" height="14" rx="3" fill="#ffc83d"/>
        <rect x="52" y="1" width="16" height="14" rx="3" fill="#185abd"/>
        <rect x="78" y="1" width="16" height="14" rx="3" fill="#8b8f99"/>
        <rect x="55" y="18" width="10" height="2" rx="1" fill="#4cc2ff"/>
      </g>
      <use xlink:href="#tray" x="430" y="277" width="16" height="16"/>
      <text x="438" y="289" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="470" y="289" font-size="10" fill="#e6e6e6" text-anchor="middle">9:41</text>
    </g>
  </g>

  <!-- ===== Desktop 2 ===== -->
  <g transform="translate(680 44)">
    <rect x="-10" y="-10" width="520" height="320" rx="16" fill="#0d1320" filter="url(#shadow)"/>
    <path d="M220 310h60l8 22h-76z" fill="#0d1320"/>
    <rect x="180" y="330" width="140" height="7" rx="3.5" fill="#0d1320"/>
    <g clip-path="url(#screen)">
      <rect width="500" height="300" fill="url(#wall2)"/>
      <rect width="500" height="300" fill="url(#bloom)"/>
      <path d="M0 300C110 200 260 230 330 300z" fill="#ffffff" opacity="0.07"/>

      <g font-size="10.5" fill="#fff" text-anchor="middle" filter="url(#txt)">
        <use xlink:href="#bin" x="22" y="10" width="36" height="36"/><text x="40" y="58">Recycle Bin</text>
        <use xlink:href="#photo" x="22" y="70" width="36" height="36"/><text x="40" y="118">Holiday.jpg</text>
        <use xlink:href="#music" x="22" y="130" width="36" height="36"/><text x="40" y="178">Music</text>
        <use xlink:href="#game" x="22" y="190" width="36" height="36"/><text x="40" y="238">Game</text>
        <use xlink:href="#folder" x="442" y="10" width="36" height="36"/><text x="460" y="58">Photos</text>
        <use xlink:href="#photo" x="442" y="70" width="36" height="36"/><text x="460" y="118">Beach.jpg</text>
      </g>

      <!-- switch overlay -->
      <g filter="url(#shadow)">
        <rect x="160" y="104" width="180" height="66" rx="10" fill="#202020" opacity="0.94"/>
      </g>
      <text x="250" y="138" font-size="21" font-weight="600" fill="#fff" text-anchor="middle">Desktop 2</text>
      <circle cx="239" cy="156" r="5" fill="none" stroke="#969696" stroke-width="1.5"/>
      <circle cx="261" cy="156" r="5.5" fill="#0078d4"/>

      <rect y="270" width="500" height="30" fill="#1b2433" opacity="0.82"/>
      <g transform="translate(219 277)">
        <g fill="#4cc2ff"><rect width="7" height="7" rx="1"/><rect x="9" width="7" height="7" rx="1"/><rect y="9" width="7" height="7" rx="1"/><rect x="9" y="9" width="7" height="7" rx="1"/></g>
        <rect x="26" y="1" width="16" height="14" rx="3" fill="#ffc83d"/>
        <rect x="52" y="1" width="16" height="14" rx="3" fill="#8b8f99"/>
      </g>
      <use xlink:href="#tray" x="430" y="277" width="16" height="16"/>
      <text x="438" y="289" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="470" y="289" font-size="10" fill="#e6e6e6" text-anchor="middle">9:41</text>
    </g>
  </g>

  <!-- ===== switch in the middle ===== -->
  <g transform="translate(620 185)">
    <circle r="36" fill="#ffffff" opacity="0.1"/>
    <circle r="36" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <path d="M-16 -7h28m-8 -8l8 8-8 8" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 9h-28m8 -8l-8 8 8 8" stroke="#4cc2ff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(620 252)" font-size="12" font-weight="600" fill="#dfe9f7" text-anchor="middle">
    <rect x="-46" y="-12" width="40" height="22" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="-26" y="4">Alt</text>
    <rect x="6" y="-12" width="40" height="22" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="26" y="4">1 / 2</text>
    <text x="0" y="4" font-weight="400" fill="#9fb3cf">+</text>
  </g>
  <!-- mouse with side buttons -->
  <g transform="translate(620 300)">
    <rect x="-13" y="0" width="26" height="40" rx="13" fill="none" stroke="#dfe9f7" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M0 0v13M-13 13h26" stroke="#dfe9f7" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="-17" y="17" width="4" height="7" rx="1.5" fill="#4cc2ff"/>
    <rect x="-17" y="26" width="4" height="7" rx="1.5" fill="#4cc2ff"/>
  </g>

  <g font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
    <text x="310" y="408">Desktop 1</text>
    <text x="930" y="408">Desktop 2</text>
  </g>
</svg>
