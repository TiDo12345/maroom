<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="'Segoe UI', 'Segoe UI Variable', Helvetica, Arial, sans-serif">
  <title>Das Maroom-Untermenü im Fenstermenü der Titelleiste</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f5c"/>
      <stop offset="1" stop-color="#071a36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="card"><rect width="1240" height="420" rx="18"/></clipPath>
  </defs>

  <rect width="1240" height="420" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#card)">

  <!-- background window -->
  <g filter="url(#shadow)"><rect x="140" y="40" width="760" height="420" rx="10" fill="#ffffff"/></g>
  <rect x="140" y="40" width="760" height="36" rx="10" fill="#f3f3f3"/>
  <rect x="140" y="66" width="760" height="10" fill="#f3f3f3"/>
  <rect x="154" y="51" width="14" height="14" rx="3" fill="#185abd"/>
  <text x="178" y="63" font-size="13" fill="#333">Bericht.docx</text>
  <path d="M808 58h10M836 52h9v9h-9zM862 52l9 9M871 52l-9 9" stroke="#555" stroke-width="1.2" fill="none"/>
  <rect x="180" y="100" width="200" height="12" rx="3" fill="#1f3b63"/>
  <g fill="#e3e8ef"><rect x="180" y="128" width="420" height="7" rx="3"/><rect x="180" y="144" width="400" height="7" rx="3"/><rect x="180" y="160" width="420" height="7" rx="3"/><rect x="180" y="176" width="300" height="7" rx="3"/><rect x="180" y="208" width="420" height="7" rx="3"/><rect x="180" y="224" width="380" height="7" rx="3"/><rect x="180" y="240" width="410" height="7" rx="3"/></g>

  <!-- cursor at title bar -->
  <path d="M300 54l0 18 4.5-4.5 3 7 2.6-1.1-3-7 6.3 0z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- system menu -->
  <g filter="url(#shadow)"><rect x="306" y="74" width="250" height="266" rx="8" fill="#f9f9f9" stroke="#d6d6d6"/></g>
  <g font-size="13.5" fill="#1a1a1a">
    <text x="346" y="102" fill="#a0a0a0">Wiederherstellen</text>
    <text x="346" y="132">Verschieben</text>
    <text x="346" y="162">Größe ändern</text>
    <text x="346" y="192">Minimieren</text>
    <text x="346" y="222">Maximieren</text>
    <rect x="312" y="236" width="238" height="1" fill="#e0e0e0"/>
    <rect x="312" y="244" width="238" height="32" rx="5" fill="#e5effa"/>
    <text x="346" y="265" font-weight="600">Maroom</text>
    <path d="M534 255l5 5-5 5" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
    <rect x="312" y="290" width="238" height="1" fill="#e0e0e0"/>
    <text x="346" y="320">Schließen</text>
    <text x="536" y="320" fill="#707070" text-anchor="end">Alt+F4</text>
    <path d="M323 311l8 8M331 311l-8 8" stroke="#1a1a1a" stroke-width="1.3"/>
    <path d="M323 186h8" stroke="#1a1a1a" stroke-width="1.3"/>
    <rect x="323" y="211" width="8" height="8" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  </g>

  <!-- Maroom submenu -->
  <g filter="url(#shadow)"><rect x="552" y="236" width="350" height="128" rx="8" fill="#f9f9f9" stroke="#d6d6d6"/></g>
  <g font-size="13.5" fill="#1a1a1a">
    <text x="592" y="264">Auf Desktop 1</text>
    <text x="886" y="264" fill="#707070" text-anchor="end">Alt+Shift+1</text>
    <rect x="558" y="276" width="338" height="32" rx="5" fill="#e5effa"/>
    <text x="592" y="297">Auf Desktop 2</text>
    <text x="886" y="297" fill="#707070" text-anchor="end">Alt+Shift+2</text>
    <rect x="558" y="316" width="338" height="1" fill="#e0e0e0"/>
    <text x="592" y="344">Auf allen Desktops anzeigen</text>
    <text x="886" y="344" fill="#707070" text-anchor="end">Alt+Shift+0</text>
  </g>

  </g>

  <!-- callout -->
  <g transform="translate(960 150)">
    <text font-size="22" font-weight="600" fill="#fff">Rechtsklick auf</text>
    <text y="28" font-size="22" font-weight="600" fill="#fff">die Titelleiste</text>
    <text y="64" font-size="14" fill="#bcd6f5">Fenster auf einen anderen Desktop</text>
    <text y="84" font-size="14" fill="#bcd6f5">schicken oder überall anheften.</text>
    <text y="116" font-size="14" fill="#9fb3cf">Keine DLL-Injektion:</text>
    <text y="136" font-size="14" fill="#9fb3cf">von außen angehängt.</text>
  </g>
</svg>
