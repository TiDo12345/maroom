name: Release

# Push a tag like v2.10 (it must match the AssemblyVersion in Maroom.cs) to build
# Maroom-Setup.exe and publish it as a GitHub release with a SHA-256 checksum.
#
# Code signing (SignPath Foundation) runs once the repository variable SIGNPATH_ORGANIZATION_ID
# and the secret SIGNPATH_API_TOKEN are set; without them the release is built unsigned as before.
# Maroom.exe is signed first, then the setup is rebuilt around the signed EXE and signed itself.
# See packaging/signpath/README.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90   # SignPath release signing waits for a manual approval
    permissions:
      contents: write   # create the release and upload the setup
      actions: read     # SignPath reads the job details and downloads the unsigned artifacts
    env:
      SIGNPATH_PROJECT: maroom
      SIGNPATH_POLICY: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: powershell
        run: .\build.ps1 -NoInstall

      - name: Check tag matches the program version
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = [version](Get-Item dist\Maroom.exe).VersionInfo.FileVersion
          $expected = "v$($v.Major).$($v.Minor)" + $(if ($v.Build -gt 0) { ".$($v.Build)" } else { '' })
          if ($env:TAG -ne $expected) { Write-Error "Tag $env:TAG does not match program version $v (expected $expected)"; exit 1 }
          Write-Host "Version $v matches tag $env:TAG"

      # --- Code signing (skipped until SignPath is configured) ---------------------------------

      - name: Upload unsigned Maroom.exe
        id: unsigned-app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: dist/Maroom.exe
          retention-days: 1

      - name: Sign Maroom.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 2400
          output-artifact-directory: dist

      - name: Rebuild the setup around the signed Maroom.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: .\build.ps1 -NoInstall -SetupOnly

      - name: Upload unsigned Maroom-Setup.exe
        id: unsigned-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-setup
          path: dist/Maroom-Setup.exe
          retention-days: 1

      - name: Sign Maroom-Setup.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 2400
          output-artifact-directory: dist

      - name: Verify signatures
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: |
          foreach ($file in 'dist\Maroom.exe', 'dist\Maroom-Setup.exe') {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file : $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$file is not validly signed"; exit 1 }
          }

      # -------------------------------------------------------------------------------------

      - name: Checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash dist\Maroom-Setup.exe -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so `sha256sum -c` also works on Linux and in Git Bash
          [IO.File]::WriteAllText("$PWD\dist\Maroom-Setup.exe.sha256", "$hash  Maroom-Setup.exe`n")
          Get-Content dist\Maroom-Setup.exe.sha256

      - name: Create release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG dist\Maroom-Setup.exe dist\Maroom-Setup.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY --title "Maroom $($env:TAG.TrimStart('v'))" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit 1 }
